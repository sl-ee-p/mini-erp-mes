# Production stack, run from /srv/apps/mini-erp-mes by the deploy job (deploy/deploy.sh).
# APP_IMAGE / WEB_IMAGE are set by the script to the exact tags being deployed; secrets come from .env.
x-app: &app
  image: ${APP_IMAGE:?set by deploy.sh}
  env_file: .env
  environment:
    APP_ENV: production
    APP_DEBUG: "false"
    DB_CONNECTION: mysql
    DB_HOST: mysql
    DB_PORT: 3306
  volumes:
    - app_storage:/var/www/html/storage
  restart: unless-stopped
  depends_on:
    mysql:
      condition: service_healthy

services:
  app:
    <<: *app
    healthcheck:
      test: ["CMD-SHELL", "cgi-fcgi -bind -connect 127.0.0.1:9000 > /dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  queue:
    <<: *app
    command: ["php", "artisan", "queue:work", "--tries=3", "--backoff=5", "--sleep=1"]
    depends_on:
      app:
        condition: service_healthy

  nginx:
    image: ${WEB_IMAGE:?set by deploy.sh}
    ports:
      - "${HOST_PORT:-8081}:80"
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:?}
      MYSQL_USER: ${DB_USERNAME:?}
      MYSQL_PASSWORD: ${DB_PASSWORD:?}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?}
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

volumes:
  mysql_data:
  app_storage:
