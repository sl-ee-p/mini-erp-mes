name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Pint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/pint --test

  static-analysis:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          coverage: none
      - uses: ramsey/composer-install@v3
      - run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

  tests:
    name: Tests (PHP ${{ matrix.php }}, MySQL 8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ["8.3", "8.4"]
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: mini_erp_testing
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: mini_erp_testing
      DB_USERNAME: root
      DB_PASSWORD: root
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, intl, zip, gd, bcmath
          coverage: ${{ matrix.php == '8.4' && 'pcov' || 'none' }}
      - uses: ramsey/composer-install@v3
      - run: cp .env.example .env && php artisan key:generate
      - name: Run test suite
        if: matrix.php != '8.4'
        run: php artisan test --compact
      - name: Run test suite with coverage
        if: matrix.php == '8.4'
        run: php artisan test --compact --coverage-text --coverage-clover=coverage.xml
      - uses: actions/upload-artifact@v4
        if: matrix.php == '8.4'
        with:
          name: coverage
          path: coverage.xml

  assets:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build

  publish:
    name: Publish images to GHCR
    needs: [lint, static-analysis, tests, assets]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      app-image: ghcr.io/${{ github.repository_owner }}/mini-erp-mes:${{ github.sha }}
      web-image: ghcr.io/${{ github.repository_owner }}/mini-erp-mes-web:${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The web image is built from the prod stage, so build the app image first and let it hit the cache.
      - name: Build and push app (php-fpm) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: prod
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mini-erp-mes:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mini-erp-mes:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build and push web (nginx) image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/php/Dockerfile
          target: web
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/mini-erp-mes-web:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/mini-erp-mes-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to home server
    needs: publish
    runs-on: [self-hosted, deploy]
    environment: production
    # Two deploys must never overlap, and a running deploy is never cancelled halfway.
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Deploy
        run: deploy/deploy.sh
        env:
          APP_IMAGE: ${{ needs.publish.outputs.app-image }}
          WEB_IMAGE: ${{ needs.publish.outputs.web-image }}
